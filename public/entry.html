<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Eintrag – TikTok für Stationen</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="container py-3">
    <div class="d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">Gebrauchsanweisung – TikTok für Stationen</h1>
      <a href="/" class="btn btn-sm btn-secondary">Zurück zur Übersicht</a>
    </div>
  </header>

  <main class="container">
    <div id="entryError" class="text-danger"></div>

    <div id="entryContent" style="display: none;">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <h2 id="entryTitle"></h2>
        <button type="button" id="entryEditButton" class="btn btn-sm btn-danger" style="display: none;">
          Bearbeiten
        </button>
      </div>

      <video id="entryVideo" class="w-100 mb-3" controls></video>

      <p id="entryDescription" class="mb-3"></p>

      <p class="text-muted small" id="entryAuthor"></p>

      <h3 class="h6">Anhänge</h3>
      <ul id="entryAttachments" class="list-group mb-3"></ul>

      <h3 class="h6">QR-Code zu dieser Seite</h3>
      <div id="entryQrCode"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script>
    // Liest die Eintrags-ID aus der URL, z. B. entry.html?id=abc123
    function getEntryIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("id");
    }

    // Holt den Eintrag vom Server und zeigt ihn an, oder zeigt eine Fehlermeldung.
    async function loadEntry() {
      const entryId = getEntryIdFromUrl();
      const errorBox = document.getElementById("entryError");

      if (!entryId) {
        errorBox.textContent = "Keine Eintrags-ID in der URL angegeben.";
        return;
      }

      const response = await fetch("/api/entries/" + encodeURIComponent(entryId));
      const entry = await response.json();

      if (!response.ok) {
        errorBox.textContent = entry.error;
        return;
      }

      showEntry(entry);
    }

    // Trägt die Eintragsdaten in die Seite ein.
    function showEntry(entry) {
      document.getElementById("entryTitle").textContent = entry.title;
      document.getElementById("entryDescription").textContent = entry.description;
      document.getElementById("entryAuthor").textContent = "Autor: " + entry.author;

      const video = document.getElementById("entryVideo");
      video.src = entry.videoPath;

      showAttachments(entry.attachments);
      showQrCode();

      document.getElementById("entryContent").style.display = "block";
    }

    // Baut die Liste der Anhänge auf.
    function showAttachments(attachments) {
      const list = document.getElementById("entryAttachments");
      list.innerHTML = "";

      if (attachments.length === 0) {
        list.innerHTML = '<li class="list-group-item text-muted">Keine Anhänge.</li>';
        return;
      }

      for (const attachmentPath of attachments) {
        const item = document.createElement("li");
        item.className = "list-group-item";

        const link = document.createElement("a");
        link.href = attachmentPath;
        link.target = "_blank";
        link.textContent = attachmentPath.split("/").pop();

        item.appendChild(link);
        list.appendChild(item);
      }
    }

    // Erzeugt den QR-Code, der auf die aktuelle Seite zeigt.
    function showQrCode() {
      new QRCode(document.getElementById("entryQrCode"), {
        text: window.location.href,
        width: 160,
        height: 160,
      });
    }

    // Blendet den roten Edit-Button nur ein, wenn der User eingeloggt ist.
    async function checkLoginForEditButton() {
      const response = await fetch("/api/session");
      const user = await response.json();

      if (user.username) {
        document.getElementById("entryEditButton").style.display = "inline-block";
      }
    }

    // Zeigt vorerst einen Hinweis, da das Bearbeiten-Formular noch nicht existiert.
    document.getElementById("entryEditButton").addEventListener("click", () => {
      alert("Bearbeiten folgt in einem späteren Schritt.");
    });

    loadEntry();
    checkLoginForEditButton();
  </script>
</body>
</html>
