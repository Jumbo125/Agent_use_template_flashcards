<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gebrauchsanweisung – TikTok für Stationen</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="container py-3">
    <div class="d-flex justify-content-between align-items-center">
      <h1 class="h4 mb-0">Gebrauchsanweisung – TikTok für Stationen</h1>
      <div>
        <span id="loginStatus" class="me-2"></span>
        <button
          type="button"
          class="btn btn-sm btn-info"
          data-bs-toggle="modal"
          data-bs-target="#loginModal"
        >
          Login
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    <!-- Weitere Bereiche (Suche, Hinzufügen, User-Infos, Feedback) folgen in späteren Schritten -->
  </main>

  <!-- Login-Modal -->
  <div
    class="modal fade"
    id="loginModal"
    tabindex="-1"
    aria-labelledby="loginModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="loginModalLabel">Login</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Schließen"
          ></button>
        </div>
        <div class="modal-body">
          <form id="loginForm">
            <div class="mb-3">
              <label for="loginUsername" class="form-label">Benutzername</label>
              <input type="text" class="form-control" id="loginUsername" required />
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label">Passwort</label>
              <input type="password" class="form-control" id="loginPassword" required />
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe" />
              <label class="form-check-label" for="rememberMe">Angemeldet bleiben</label>
            </div>
            <div id="loginError" class="text-danger small mb-2"></div>
            <button type="submit" class="btn btn-sm btn-info">Einloggen</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
