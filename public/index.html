<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gebrauchsanweisung – TikTok für Stationen</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="container py-3">
    <h1 class="h4 mb-0">Gebrauchsanweisung – TikTok für Stationen</h1>
  </header>

  <main class="container">
    <div class="accordion" id="mainAccordion">
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button
            class="accordion-button bg-dark text-white"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#searchCollapse"
          >
            Suche
          </button>
        </h2>
        <div class="accordion-collapse collapse show" id="searchCollapse" data-bs-parent="#mainAccordion">
          <div class="accordion-body">
            <form id="searchForm" class="d-flex gap-2 mb-3">
              <input
                type="text"
                class="form-control"
                id="searchInput"
                placeholder="Suchbegriff (mind. 4 Zeichen)"
              />
              <button type="submit" class="btn btn-success">Suchen</button>
            </form>
            <div id="searchResults" class="search-results list-group"></div>
          </div>
        </div>
      </div>
      <div class="accordion-item" id="addEntrySection" style="display: none;">
        <h2 class="accordion-header">
          <button
            class="accordion-button bg-success text-white"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#addEntryCollapse"
          >
            Eintrag hinzufügen
          </button>
        </h2>
        <div class="accordion-collapse collapse" id="addEntryCollapse" data-bs-parent="#mainAccordion">
          <div class="accordion-body">
            <form id="addEntryForm">
              <div class="mb-3">
                <label for="entryTitle" class="form-label">Titel</label>
                <input type="text" class="form-control" id="entryTitle" required />
              </div>
              <div class="mb-3">
                <label for="entryDescription" class="form-label">Beschreibung</label>
                <textarea class="form-control" id="entryDescription" rows="4" required></textarea>
              </div>
              <div class="mb-3">
                <label for="entryVideo" class="form-label">Video</label>
                <input type="file" class="form-control" id="entryVideo" accept="video/*" required />
              </div>
              <div class="mb-3">
                <label for="entryAttachments" class="form-label">Anhänge</label>
                <input type="file" class="form-control" id="entryAttachments" multiple />
              </div>
              <div id="addEntryError" class="text-danger small mb-2"></div>
              <div id="addEntrySuccess" class="text-success small mb-2"></div>
              <button type="submit" class="btn btn-success">Speichern</button>
            </form>
            <div id="newEntryBox" style="display: none;" class="mt-3">
              <p class="mb-2">
                Link zum neuen Eintrag:
                <a id="newEntryLink" href="#" target="_blank"></a>
              </p>
              <div id="newEntryQrCode"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="accordion-item" id="userInfoSection" style="display: none;">
        <h2 class="accordion-header">
          <button
            class="accordion-button bg-warning text-dark"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#userInfoCollapse"
          >
            User-Infos
          </button>
        </h2>
        <div class="accordion-collapse collapse" id="userInfoCollapse" data-bs-parent="#mainAccordion">
          <div class="accordion-body">
            <form id="userInfoForm">
              <div class="mb-3">
                <label for="userInfoUsername" class="form-label">Benutzername</label>
                <input type="text" class="form-control" id="userInfoUsername" required />
              </div>
              <div class="mb-3">
                <label for="userInfoName" class="form-label">Name</label>
                <input type="text" class="form-control" id="userInfoName" required />
              </div>
              <div class="mb-3">
                <label for="userInfoPassword" class="form-label">
                  Neues Passwort (leer lassen, um es nicht zu ändern)
                </label>
                <input type="password" class="form-control" id="userInfoPassword" />
              </div>
              <p class="mb-2">Letzter Login: <span id="userInfoLastLogin"></span></p>
              <div id="userInfoError" class="text-danger small mb-2"></div>
              <div id="userInfoSuccess" class="text-success small mb-2"></div>
              <button type="submit" class="btn btn-success">Speichern</button>
            </form>
          </div>
        </div>
      </div>
      <div class="accordion-item">
        <h2 class="accordion-header">
          <button
            class="accordion-button bg-light text-dark"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#feedbackCollapse"
          >
            Feedback
          </button>
        </h2>
        <div class="accordion-collapse collapse" id="feedbackCollapse" data-bs-parent="#mainAccordion">
          <div class="accordion-body">
            <p class="text-muted">Feedback-Formular folgt in einem späteren Schritt.</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="container py-3 d-flex justify-content-between align-items-center">
    <span id="loginStatus"></span>
    <div>
      <button
        type="button"
        id="loginButton"
        class="btn btn-sm btn-info"
        data-bs-toggle="modal"
        data-bs-target="#loginModal"
      >
        Login
      </button>
      <button
        type="button"
        id="impressumButton"
        class="btn btn-sm btn-warning"
        data-bs-toggle="modal"
        data-bs-target="#impressumModal"
      >
        Impressum
      </button>
    </div>
  </footer>

  <!-- Login-Modal -->
  <div
    class="modal fade"
    id="loginModal"
    tabindex="-1"
    aria-labelledby="loginModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="loginModalLabel">Login</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Schließen"
          ></button>
        </div>
        <div class="modal-body">
          <form id="loginForm">
            <div class="mb-3">
              <label for="loginUsername" class="form-label">Benutzername</label>
              <input type="text" class="form-control" id="loginUsername" required />
            </div>
            <div class="mb-3">
              <label for="loginPassword" class="form-label">Passwort</label>
              <input type="password" class="form-control" id="loginPassword" required />
            </div>
            <div class="mb-3 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe" />
              <label class="form-check-label" for="rememberMe">Angemeldet bleiben</label>
            </div>
            <div id="loginError" class="text-danger small mb-2"></div>
            <button type="submit" class="btn btn-sm btn-info">Einloggen</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Impressum-Modal -->
  <div
    class="modal fade"
    id="impressumModal"
    tabindex="-1"
    aria-labelledby="impressumModalLabel"
    aria-hidden="true"
  >
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="impressumModalLabel">Impressum</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="modal"
            aria-label="Schließen"
          ></button>
        </div>
        <div class="modal-body">
          <p class="text-muted">Inhalt folgt – bitte Kontaktdaten der Station ergänzen.</p>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
