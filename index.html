<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Study Finder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="container py-4 py-md-5">
      <section class="finder-card card border-0 shadow-sm p-3 p-md-5">
        <div class="d-flex align-items-start justify-content-between gap-3">
          <h1 class="display-6 fw-bold mb-3">Clinical Study Finder</h1>
          <button class="btn btn-outline-primary" id="openLogin" type="button"
            data-bs-toggle="modal" data-bs-target="#loginModal">
            <i class="bi bi-person"></i> Login
          </button>
        </div>
        <p class="intro text-secondary mb-4">
          A simple website for principal investigators, sub-investigators
          and physicians to find clinical studies in gastroenterology.
        </p>

        <div class="study-admin-actions d-flex flex-wrap gap-2 mb-4" id="studyAdminActions" hidden>
          <button class="btn btn-primary" id="addStudyButton" type="button"
            data-bs-toggle="modal" data-bs-target="#studyModal">
            <i class="bi bi-plus-circle"></i> Add study
          </button>
          <button class="btn btn-outline-primary" id="downloadStudiesButton" type="button">
            <i class="bi bi-download"></i> Save studies as JSON
          </button>
          <button class="btn btn-outline-secondary" id="openUserPanelButton" type="button" hidden>
            <i class="bi bi-person-gear"></i> User panel
          </button>
        </div>

        <h2 class="h5 text-uppercase text-primary fw-semibold mb-3">Select a category</h2>
        <div class="row g-3 category-list" aria-label="Study categories">
          <div class="col-12 col-md-4">
            <button class="category-button ced btn w-100" type="button" data-category="CED">
              <i class="bi bi-capsule fs-4 mb-1"></i>
              <span>CED</span>
            </button>
          </div>
          <div class="col-12 col-md-4">
            <button class="category-button liver btn w-100" type="button" data-category="Liver">
              <i class="bi bi-droplet-half fs-4 mb-1"></i>
              <span>Liver</span>
            </button>
          </div>
          <div class="col-12 col-md-4">
            <button class="category-button esophagus btn w-100" type="button" data-category="Esophagus">
              <i class="bi bi-activity fs-4 mb-1"></i>
              <span>Esophagus</span>
            </button>
          </div>
        </div>
        <p class="category-result fw-semibold mb-0" id="categoryResult" aria-live="polite">
          Please select a category.
        </p>
        <nav class="navigation-actions" aria-label="Study navigation">
          <button class="btn btn-link p-0" id="backToCategories" type="button" hidden>
            <i class="bi bi-arrow-left"></i> Back to categories
          </button>
        </nav>
        <div class="study-list list-group" id="studyList"></div>
      </section>
    </div>
  </main>

  <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="loginTitle">Login</h2>
          <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form class="modal-body" id="loginForm">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" type="text" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password" required>
          </div>
          <p class="text-danger mb-0" id="loginMessage" aria-live="polite"></p>
          <div class="d-flex justify-content-end mt-3">
            <button class="btn btn-primary" type="submit">Login</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="studyModal" tabindex="-1" aria-labelledby="studyModalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="studyModalTitle">Add study</h2>
          <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form class="modal-body" id="studyForm">
          <input id="studyIndex" type="hidden" value="-1">
          <div class="mb-3">
            <label class="form-label" for="studyTitle">Title</label>
            <input class="form-control" id="studyTitle" type="text" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="studyCategory">Category</label>
            <select class="form-select" id="studyCategory" required>
              <option value="CED">CED</option>
              <option value="Liver">Liver</option>
              <option value="Esophagus">Esophagus</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label" for="studyOverview">Short description / IP</label>
            <input class="form-control" id="studyOverview" type="text" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="studyDetails">Details</label>
            <textarea class="form-control" id="studyDetails" rows="3" required></textarea>
          </div>
          <div class="form-check mb-3">
            <input class="form-check-input" id="studyRecruiting" type="checkbox">
            <label class="form-check-label" for="studyRecruiting">Recruiting</label>
          </div>
          <div class="d-flex justify-content-end gap-2">
            <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">Cancel</button>
            <button class="btn btn-primary" type="submit">Save study</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="userAccountModal" tabindex="-1"
    aria-labelledby="userAccountTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title h5" id="userAccountTitle">Admin user panel</h2>
          <button class="btn-close" type="button" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form class="modal-body" id="userAccountForm">
          <div class="mb-3">
            <label class="form-label" for="accountUsername">Username</label>
            <input class="form-control" id="accountUsername" type="text" required>
          </div>
          <div class="mb-3">
            <label class="form-label" for="accountPassword">New password</label>
            <input class="form-control" id="accountPassword" type="password"
              autocomplete="new-password">
            <div class="form-text">Leave blank to keep the current password.</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="accountPasswordConfirm">Confirm new password</label>
            <input class="form-control" id="accountPasswordConfirm" type="password"
              autocomplete="new-password">
          </div>
          <p class="text-danger mb-0" id="userAccountMessage" aria-live="polite"></p>
          <div class="d-flex justify-content-end gap-2 mt-3">
            <button class="btn btn-outline-secondary" type="button" data-bs-dismiss="modal">
              Cancel
            </button>
            <button class="btn btn-primary" type="submit">Save account</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
