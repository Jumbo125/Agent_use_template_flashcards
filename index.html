<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clinical Study Finder</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <div class="container py-4 py-md-5">
      <section class="finder-card card border-0 shadow-sm p-3 p-md-5">
        <h1 class="display-6 fw-bold mb-3">Clinical Study Finder</h1>
        <p class="intro text-secondary mb-4">
          A simple website for principal investigators, sub-investigators
          and physicians to find clinical studies in gastroenterology.
        </p>

        <h2 class="h5 text-uppercase text-primary fw-semibold mb-3">Select a category</h2>
        <div class="row g-3 category-list" aria-label="Study categories">
          <div class="col-12 col-md-4">
            <button class="category-button ced btn w-100" type="button" data-category="CED">
              <i class="bi bi-capsule fs-4 mb-1"></i>
              <span>CED</span>
            </button>
          </div>
          <div class="col-12 col-md-4">
            <button class="category-button liver btn w-100" type="button" data-category="Liver">
              <i class="bi bi-droplet-half fs-4 mb-1"></i>
              <span>Liver</span>
            </button>
          </div>
          <div class="col-12 col-md-4">
            <button class="category-button esophagus btn w-100" type="button" data-category="Esophagus">
              <i class="bi bi-activity fs-4 mb-1"></i>
              <span>Esophagus</span>
            </button>
          </div>
        </div>
        <p class="category-result fw-semibold mb-0" id="categoryResult" aria-live="polite">
          Please select a category.
        </p>
        <nav class="navigation-actions" aria-label="Study navigation">
          <button class="btn btn-link p-0" id="backToCategories" type="button" hidden>
            <i class="bi bi-arrow-left"></i> Back to categories
          </button>
        </nav>
        <div class="study-list list-group" id="studyList"></div>
      </section>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
